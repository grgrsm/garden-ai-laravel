version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: laravel-study-app
        container_name: laravel_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        ports:
            - "5173:5173"
        networks:
            - laravel-network
        depends_on:
            - db
            - redis

    web:
        image: nginx:alpine
        container_name: laravel_nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/conf.d:/etc/nginx/conf.d
        networks:
            - laravel-network

    db:
        image: mariadb:latest
        container_name: laravel_mariadb
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: laravel_study
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_USER: laravel
            MYSQL_PASSWORD: password
        ports:
            - "3306:3306"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - laravel-network

    redis:
        image: redis:alpine
        container_name: laravel_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        networks:
            - laravel-network

volumes:
    dbdata:
        driver: local

networks:
    laravel-network:
        driver: bridge
